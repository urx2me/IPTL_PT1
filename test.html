<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Uploader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 500px; margin: auto; text-align: center; }
        #preview { max-width: 100%; height: auto; display: none; }
        .story-container { display: flex; overflow-x: auto; margin-top: 20px; }
        .story { width: 100px; height: 150px; border: 1px solid #ccc; margin-right: 10px; cursor: pointer; }
        .story-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; }
        .story-viewer-content { max-width: 90%; max-height: 90%; }
        .close-btn { position: absolute; top: 10px; right: 10px; background: white; border: none; padding: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Upload Story</h2>
        <input type="file" id="fileInput" accept="image/*,video/*">
        <input type="file" id="audioInput" accept="audio/*">
        <br>
        <canvas id="canvas" style="display: none;"></canvas>
        <video id="videoPreview" controls style="display: none;"></video>
        <img id="preview">
        <br>
        <button id="rotateLeft">Rotate Left</button>
        <button id="rotateRight">Rotate Right</button>
        <button id="postStory">Post Story</button>
        <div class="story-container" id="stories"></div>
    </div>

    <div class="story-viewer" id="storyViewer">
        <button class="close-btn" id="closeViewer">Close</button>
        <div class="story-viewer-content" id="viewerContent"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        let fileInput = document.getElementById('fileInput');
        let audioInput = document.getElementById('audioInput');
        let preview = document.getElementById('preview');
        let videoPreview = document.getElementById('videoPreview');
        let canvas = document.getElementById('canvas');
        let postStory = document.getElementById('postStory');
        let storiesContainer = document.getElementById('stories');
        let storyViewer = document.getElementById('storyViewer');
        let viewerContent = document.getElementById('viewerContent');
        let closeViewer = document.getElementById('closeViewer');
        let rotateLeft = document.getElementById('rotateLeft');
        let rotateRight = document.getElementById('rotateRight');
        let cropper, selectedFile, audioFile;

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            selectedFile = file;
            if (!file) return;
            
            if (file.type.startsWith('image/')) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    videoPreview.style.display = 'none';
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(preview, { aspectRatio: 1 });
                };
                reader.readAsDataURL(file);
            } else if (file.type.startsWith('video/')) {
                preview.style.display = 'none';
                videoPreview.src = URL.createObjectURL(file);
                videoPreview.style.display = 'block';
            }
        });

        audioInput.addEventListener('change', function(event) {
            audioFile = event.target.files[0];
        });

        rotateLeft.addEventListener('click', function() {
            if (cropper) cropper.rotate(-90);
        });

        rotateRight.addEventListener('click', function() {
            if (cropper) cropper.rotate(90);
        });

        postStory.addEventListener('click', function() {
            if (!selectedFile) return;
            let storyElement = document.createElement('div');
            storyElement.classList.add('story');
            
            if (selectedFile.type.startsWith('image/')) {
                let croppedCanvas = cropper.getCroppedCanvas();
                let imgSrc = croppedCanvas.toDataURL();
                storyElement.innerHTML = `<img src="${imgSrc}" style="width:100%; height:100%">`;
                storyElement.addEventListener('click', function() {
                    viewerContent.innerHTML = `<img src="${imgSrc}" style="max-width:100%; max-height:100%">`;
                    storyViewer.style.display = 'flex';
                });
            } else if (selectedFile.type.startsWith('video/')) {
                let videoSrc = URL.createObjectURL(selectedFile);
                storyElement.innerHTML = `<video src="${videoSrc}" controls style="width:100%; height:100%"></video>`;
                storyElement.addEventListener('click', function() {
                    viewerContent.innerHTML = `<video src="${videoSrc}" controls autoplay style="max-width:100%; max-height:100%"></video>`;
                    storyViewer.style.display = 'flex';
                });
            }
            
            storiesContainer.appendChild(storyElement);
        });

        closeViewer.addEventListener('click', function() {
            storyViewer.style.display = 'none';
            viewerContent.innerHTML = '';
        });
    </script>
</body>
</html>
