<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
          font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #f1f1f1;
        }

        header {
            background-color: #e10600;
            color: white;
            text-align: center;
            padding: 1.5em 0;
            font-size: 2em;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        nav {
            background-color: #202020;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0.7em 0;
        }

        nav a {
            color: #f1f1f1;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
            padding: 0.5em 1em;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.3s;
        }

        nav a:hover {
            background-color: #e10600;
            transform: scale(1.1);
        }

        .f1-info-section {
      background-color: #1a1a1a; 
      border-radius: 20px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
      width: 90%;
      max-width: 600px;
    }

    .f1-image {
      width: 100%;
      height: auto;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .f1-text h2 {
      font-size: 2rem;
      font-family:"Montserrat", sans-serif;
      margin: 0 0 10px;
      color: #c8102e; 
    }

    .f1-text p {
      font-size: 1rem;
      font-family: 'Arial', sans-serif; 
      color: white; 
      line-height: 1.5;
      display: flex;
    justify-content: space-between;
    width: 100%;
    }

    .upload-container {
      background-color: #1a1a1a; 
      border-radius: 20px;
      margin: 40px auto;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      border: 2px dashed #c8102e; 
      display: none; 
    }

    .upload-container h2 {
      font-size: 1.6rem;
      margin-bottom: 20px;
      color: #c8102e; 
    }

    .upload-container input,
    .upload-container button {
      width: 90%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #c8102e; 
      font-size: 1rem;
      outline: none;
      background-color: #333; 
      color: white; 
    }

    .upload-container button {
      background-color: #c8102e; 
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .upload-container button:hover {
      background-color: #a60e2e; 
    }

    .toggle-upload-button {
      background-color: #c8102e; 
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      margin: 20px auto;
      display: block;
      transition: background-color 0.3s ease;
    }

    .toggle-upload-button:hover {
      background-color: #a60e2e; 
    }

    .stories-container {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding: 20px;
      background-color: #1a1a1a; 
      width: 90%;
      max-width: 100%;
      margin: 30px auto;
      border-radius: 20px;
    }

    .story {
      width: 120px;
      height: 213px;
      margin-right: 15px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 2px solid #c8102e; 
      background: linear-gradient(135deg, #f9f3ff, #fff3ff);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .story:hover {
      transform: scale(1.05);
    }

    .story img,
    .story video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .reaction-container {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .reaction-button {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      margin: 0 5px;
      transition: transform 0.3s ease;
    }

    .reaction-button.clicked {
      transform: scale(1.5); 
    }

    .story-viewer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9); 
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .story-viewer.active {
      display: flex;
    }

    .story-viewer-title {
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
      padding: 0 20px;
    }

    .story-viewer-content {
      width: 80%;
      max-width: 800px;
      height: 80%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .story-viewer img,
    .story-viewer video {
      width: 100%;
      max-width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
    }

    .navigation-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: transparent; 
      border: none;
      color: white; 
      font-size: 2rem;
      cursor: pointer;
    }

    .navigation-button:hover {
      color: #f1c40f; 
    }

    .navigation-button.left {
      left: 10px;
    }

    .navigation-button.right {
      right: 10px;
    }

    .close-button {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #c8102e; 
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 1rem;
    }

    .close-button:hover {
      background-color: #a60e2e; 
    }

    footer {
            background-color: #202020;
            color: white;
            text-align: center;
            padding: 0.10em 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .logo {
    position: absolute; 
    left: 20px;
    top: 7%; 
    transform: translateY(-50%); 
    height: 80px;
    width: auto; 
        }
        
    </style>
</head>
<body>

<header>
  <img src="logo.png" alt="F1 Logo" class="logo"> 
</header>

<nav>
    <a href="home.html">Home</a>
    <a href="news.html">News</a>
    <a href="create.html">Create</a>
    <a href="feed.html">Feed</a>
    <a href="about.html">About</a>
</nav>

<div class="f1-info-section">
    <div class="f1-text">
      <h2>Welcome to PitLane!</h2>
      <p> Lights out and away we go! Share your racing stories, relive epic moments, and connect with fans who live for speed and adrenaline. The track is yours—let’s race through the passion together!</p>
    </div>
  </div>

  <button class="toggle-upload-button" onclick="toggleUploadOptions()">Upload a Story</button>

  <div class="upload-container" id="uploadContainer">
    <h2>Create a Story</h2>
    <input type="file" id="mediaInput" accept="image/*,video/*" multiple>
    <input type="text" id="storyTitle" placeholder="Enter story title">
    <input type="file" id="musicInput" accept="audio/*" class="music-input">
    <button onclick="addStories()">Post Stories</button>
  </div>

  <div class="stories-container" id="storiesContainer">
    <div class="story add-story" onclick="document.getElementById('mediaInput').click()">
      <span>+</span>
    </div>
  </div>

  <div class="story-viewer" id="storyViewer">
    <div class="story-viewer-title" id="storyViewerTitle"></div>
    <div class="story-viewer-content" id="storyViewerContent"></div>
    <div class="reaction-container" id="reactionContainer" style="display: none;">
      <button class="reaction-button" onclick="handleReaction('❤️')">❤️</button>
      <button class="reaction-button" onclick="handleReaction('👍')">👍</button>
      <button class="reaction-button" onclick="handleReaction('😂')">😂</button>
      <button class="reaction-button" onclick="handleReaction('😮')">😮</button>
      <button class="reaction-button" onclick="handleReaction('😢')">😢</button>
    </div>
    <button class="navigation-button left" onclick="navigateStory(-1)">&#8592;</button>
    <button class="navigation-button right" onclick="navigateStory(1)">&#8594;</button>
    <button class="close-button" onclick="closeStory()">Close</button>
  </div>

  <footer>
    &copy; 2025 F1 Social. All Rights Reserved.
  </footer>

  <script>
    const storiesContainer = document.getElementById('storiesContainer');
    const storyViewer = document.getElementById('storyViewer');
    const storyViewerContent = document.getElementById('storyViewerContent');
    const storyViewerTitle = document.getElementById('storyViewerTitle');
    const uploadContainer = document.getElementById('uploadContainer');
    const reactionContainer = document.getElementById('reactionContainer');
    let storyQueue = [];
    let currentStoryIndex = 0;
    let autoTimer;
    const reactionCounts = {};

    function toggleUploadOptions() {
      if (uploadContainer.style.display === "none" || uploadContainer.style.display === "") {
        uploadContainer.style.display = "block";
      } else {
        uploadContainer.style.display = "none";
      }
    }

    function addStories() {
      const mediaInput = document.getElementById('mediaInput');
      const storyTitleInput = document.getElementById('storyTitle');
      const musicInput = document.getElementById('musicInput');
      const files = Array.from(mediaInput.files);
      const storyTitle = storyTitleInput.value.trim();
      const musicFile = musicInput.files[0];

      if (files.length === 0) {
        alert('Please select at least one image or video.');
        return;
      }

      files.forEach((file) => {
        const storyElement = document.createElement('div');
        storyElement.classList.add('story');
        const url = URL.createObjectURL(file);
        const title = storyTitle || "Untitled Story";

        if (file.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = url;
          storyElement.appendChild(img);
        } else if (file.type.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = url;
          video.controls = false;
          storyElement.appendChild(video);
        } else {
          alert('Unsupported file type.');
          return;
        }

        storyElement.addEventListener('click', () => {
          storyQueue = Array.from(storiesContainer.children)
            .filter(child => child !== storiesContainer.children[0])
            .map(child => ({
              src: child.querySelector('img, video').src,
              type: child.querySelector('img') ? 'image' : 'video',
              title: title,
              music: musicFile ? URL.createObjectURL(musicFile) : null
            }));

          currentStoryIndex = storyQueue.findIndex(item => item.src === url);
          showStory(currentStoryIndex);
        });

        storiesContainer.appendChild(storyElement);
        storyTitleInput.value = '';
        mediaInput.value = '';
        musicInput.value = '';
      });
    }

    function handleReaction(reaction) {
      reactionCounts[reaction] = (reactionCounts[reaction] || 0) + 1; 
      alert(`You reacted with ${reaction}! Total: ${reactionCounts[reaction]}`);
    }

    function showStory(index) {
      if (index < 0 || index >= storyQueue.length) {
        closeStory();
        return;
      }

      const story = storyQueue[index];
      storyViewerContent.innerHTML = '';
      storyViewerTitle.textContent = story.title;

      if (story.type === 'image') {
        const img = document.createElement('img');
        img.src = story.src;
        storyViewerContent.appendChild(img);
      } else if (story.type === 'video') {
        const video = document.createElement('video');
        video.src = story.src;
        video.autoplay = true;
        video.controls = true;
        storyViewerContent.appendChild(video);
      }

      storyViewer.classList.add('active');
      reactionContainer.style.display = 'flex'; 
    }

    function closeStory() {
      storyViewer.classList.remove('active');
      clearTimeout(autoTimer);
      storyViewerContent.innerHTML = ''; 
      reactionContainer.style.display = 'none'; 
    }

    function resetAutoTimer() {
      clearTimeout(autoTimer);
      autoTimer = setTimeout(() => {
        navigateStory(1);
      }, 5000);
    }

    function navigateStory(direction) {
      currentStoryIndex += direction;
      showStory(currentStoryIndex);
    }
  </script>
</body>
</html>
